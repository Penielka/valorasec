# Mergify configuration
# https://docs.mergify.com/

queue_rules:
  - name: default
    queue_conditions:
      - check-success=typecheck
      - check-success=lint
      - check-success=test
      - '#approved-reviews-by>=1'
    merge_conditions:
      - check-success=typecheck
      - check-success=lint
      - check-success=test
    merge_method: squash
    update_method: merge

pull_request_rules:
  - name: automatic merge when CI passes and approved
    conditions:
      - check-success=typecheck
      - check-success=lint
      - check-success=test
      - '#approved-reviews-by>=1'
      - base=main
      - label!=wip
      - label!=do-not-merge
    actions:
      queue:
        name: default
        method: squash

  - name: request reviews from maintainer
    conditions:
      - -closed
      - -draft
      - -author=~^dependabot
    actions:
      request_reviews:
        - users:
            - solomon35-stack

  - name: delete branch after merge
    conditions:
      - merged
    actions:
      delete_head_branch: {}

  - name: warn on conflicts
    conditions:
      - conflict
    actions:
      comment:
        message: |
          ⚠️ This pull request has merge conflicts. Please resolve them before it can be merged.
      label:
        add:
          - has-conflicts
