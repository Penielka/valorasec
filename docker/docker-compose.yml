services:
  postgres:
    image: postgres:16-alpine
    container_name: valorasec-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: valorasec
      POSTGRES_DB: valorasec
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: valorasec-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-runner
    container_name: valorasec-api
    environment:
      DATABASE_URL: postgresql://postgres:valorasec@postgres:5432/valorasec?schema=public
      JWT_SECRET: valorasec-secret-change-me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_MS: '604800000'
      PORT: '4000'
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web-runner
    container_name: valorasec-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
