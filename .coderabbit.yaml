# CodeRabbit configuration
# https://coderabbit.ai/docs
language: en-US
early_access: false
reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - '!dist/**'
    - '!.next/**'
    - '!node_modules/**'
    - '!target/**'
    - '!pnpm-lock.yaml'
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
chat:
  auto_reply: true
